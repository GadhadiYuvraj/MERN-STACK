<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>display</title>
		<style>
			.block {
				display: block;
				background-color: lightblue;
				padding: 10px;
				margin: 5px ;
			}
            .inline{
                display:inline;
                background-color: lightgreen;
                padding:10px;
                margin:5px;
            }

            .inline-block{
                display: inline-block;
                background-color: lightcoral;
                padding: 10px;
                margin: 5px;
                width: 100px;
                height: 50px;
            }


		</style>
	</head>
	<body>
		<h2>Display: Block</h2>
		<div class="block">Box 1 (Block)</div>
		<div class="block">Box 2 (Block)</div>
		<p>Each block takes the full line, so next move</p>

		<h2>Display:Inline</h2>
		<span class="inline">Word1</span>
		<span class="inline">Word2</span>
		<span class="inline">Word3</span>
		<p>Inline boxes sit side by side</p>

		<h2>Display : Inline-block</h2>
		<div class="inline-block">Box A</div>
		<div class="inline-block">Box B</div>
		<div class="inline-block">Box C</div>
		<p>
			Inline-block boxes sit next to each other but keep width and height like
			real boxes
		</p>
	</body>
</html>
